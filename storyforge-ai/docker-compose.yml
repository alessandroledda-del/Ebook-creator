services:
  db:
    image: postgres:17-alpine
    env_file:
      - .env
    volumes:
      - storyforge_pg:/var/lib/postgresql/data
  web:
    build: .
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "5000:5000"
    volumes:
      - storyforge_media:/var/data/generated
volumes:
  storyforge_pg:
  storyforge_media:
