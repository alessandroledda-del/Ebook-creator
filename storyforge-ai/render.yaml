databases:
  - name: storyforge-db
    region: frankfurt
    databaseName: storyforge
    user: storyforge

services:
  - type: web
    name: storyforge-ai
    runtime: docker
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: storyforge-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-6-luna
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2.5-sunburst
      - key: MEDIA_ROOT
        value: /var/data/generated
    disk:
      name: storyforge-media
      mountPath: /var/data
      sizeGB: 1
